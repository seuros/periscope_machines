[package]
name = "periscope-machines"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Scoped integer ids: a caller-chosen scope in the top 16 bits, a never-reissued sequence below"
repository = "https://github.com/seuros/periscope_machines"
readme = "README.md"
exclude = [
    "src/**/tests.rs",
    "src/tests/",
    "tests/",
    ".github/",
    ".dictate.toml",
    ".gitignore",
    "mise.toml",
    "release-please-config.json",
    ".release-please-manifest.json",
]
keywords = ["id", "handle", "scope", "deterministic", "no-std"]
categories = ["no-std", "algorithms", "data-structures"]

[lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
